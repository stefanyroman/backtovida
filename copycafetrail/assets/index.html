<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back To Vida Cafe</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<header class="nav">
    <div class="logo">Back To Vida</div>

    <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- HERO -->
<section class="hero">

    <div class="hero-image">
        <img src="img/storeprof.jpeg" alt="Cafe Hero">
    </div>

    <div class="overlay"></div>

    <div class="hero-text">
        <h1>Back To Vida Cafe</h1>
        <h2>A creative cafe & community space.</h2>
    </div>

</section>

<!-- MOBILE ACTION BUTTONS -->
<div class="mobile-actions">
    <button>Call Now</button>
    <button>Social Media</button>
</div>

<!-- 🌿 FEATURE GRID (REPLACES EVERYTHING BELOW HERO) -->
<section class="feature-grid">

    <div class="feature big">
        <img src="img/event.jpeg" alt="Event">
        <div class="feature-text">
            <h2>Upcoming Events</h2>
            <p>Live music, pop-ups & community nights</p>
        </div>
    </div>

    <div class="feature">
        <img src="img/springmenu.jpg" alt="Menu">
        <div class="feature-text">
            <h2>Beverages Menu</h2>
            <p>Seasonal coffees and energy drinks</p>
        </div>
    </div>

    <div class="feature">
        <img src="img/communitypic.jpeg" alt="Community">
        <div class="feature-text">
            <h2>Community Space</h2>
            <p>A welcoming environment for all</p>
        </div>
    </div>

    <div class="feature wide">
        <img src="img/storeprof.jpeg" alt="Cafe">
    </div>

</section>

<!-- FOOTER -->
<footer class="footer">

    <h2>Stay in the Loop</h2>

    <div class="signup">
        <input type="text" placeholder="Email">
        <button>Sign Up</button>
    </div>

    <p class="small">© 2026 Back To Vida Cafe</p>

</footer>

</body>
</html>
