<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Back To Vida Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Back To Vida Cafe</h1>
</header>

<nav class="categories">
    <button class="active">All</button>
    <button>Coffee</button>
    <button>Tea</button>
    <button>Pastries</button>
</nav>

<div class="container">

    <!-- PRODUCTS -->
    <section class="products">

        <div class="card">
            <div class="image">Image 1</div>
            <div class="info">
                <h3>Vida Latte</h3>
                <p>$4.50</p>
            </div>
            <button>Add</button>
        </div>

        <div class="card">
            <div class="image">Image 2</div>
            <div class="info">
                <h3>Brown Sugar Vida</h3>
                <p>$5.25</p>
            </div>
            <button>Add</button>
        </div>

        <div class="card">
            <div class="image">Image 3</div>
            <div class="info">
                <h3>Iced Vida Coffee</h3>
                <p>$3.75</p>
            </div>
            <button>Add</button>
        </div>

        <div class="card">
            <div class="image">Image 4</div>
            <div class="info">
                <h3>Caramel Vida Brew</h3>
                <p>$5.00</p>
            </div>
            <button>Add</button>
        </div>

    </section>

    <!-- CART -->
    <aside class="cart">
        <h2>Your Order</h2>

        <div class="cart-item">
            <p>Vida Latte</p>
            <span>$4.50</span>
        </div>

        <div class="cart-item">
            <p>Vida Croissant</p>
            <span>$3.25</span>
        </div>

        <div class="total">
            <strong>Total</strong>
            <strong>$7.75</strong>
        </div>

        <button class="checkout">Checkout</button>
    </aside>

</div>

</body>
</html>
