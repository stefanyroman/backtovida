<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Back To Vida Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Back To Vida Cafe</h1>
</header>

<nav class="categories">
    <button class="active">All</button>
    <button>Coffee</button>
    <button>Tea</button>
    <button>Pastries</button>
</nav>

<section class="products">

    <div class="card">
        <div class="image">Image 1</div>
        <h3>Vida Latte</h3>
        <p>$4.50</p>
        <button>Add</button>
    </div>

    <div class="card">
        <div class="image">Image 2</div>
        <h3>Brown Sugar Espresso</h3>
        <p>$5.25</p>
        <button>Add</button>
    </div>

    <div class="card">
        <div class="image">Image 3</div>
        <h3>Vida Iced Coffee</h3>
        <p>$3.75</p>
        <button>Add</button>
    </div>

    <div class="card">
        <div class="image">Image 4</div>
        <h3>Caramel Vida Brew</h3>
        <p>$5.00</p>
        <button>Add</button>
    </div>

    <div class="card">
        <div class="image">Image 5</div>
        <h3>Vida Matcha</h3>
        <p>$4.75</p>
        <button>Add</button>
    </div>

    <div class="card">
        <div class="image">Image 6</div>
        <h3>Vida Croissant</h3>
        <p>$3.25</p>
        <button>Add</button>
    </div>

</section>

</body>
</html>
